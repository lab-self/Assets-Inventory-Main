name: Deploy Inventory Management

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu

    runs-on:
      - self-hosted
      - Linux
      - X64

    timeout-minutes: 30

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1


      # ==========================================================
      # 2. Verify deployment workspace
      # ==========================================================

      - name: Verify deployment workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Frontend source:"
          find frontend/src -maxdepth 2 -type f -print

          echo ""
          echo "Required files:"

          test -f frontend/src/App.tsx
          test -f frontend/src/main.tsx
          test -f frontend/src/index.css

          test -f frontend/Dockerfile
          test -f frontend/nginx.conf

          test -f backend/Dockerfile
          test -f backend/package.json
          test -f backend/tsconfig.json

          test -f backend/src/database/migrate.ts
          test -f backend/src/database/seed.ts

          test -f docker-compose.yml

          echo ""
          echo "Docker:"
          docker --version
          docker compose version

          echo ""
          echo "Workspace verification successful."


      # ==========================================================
      # 3. Verify Docker
      # ==========================================================

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail

          docker info >/dev/null

          echo "Docker daemon is available."


      # ==========================================================
      # 4. Create production environment
      # ==========================================================

      - name: Create production environment
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

        run: |
          set -euo pipefail

          # ------------------------------------------------------
          # Required secrets
          # ------------------------------------------------------

          if [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "ERROR: POSTGRES_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${JWT_SECRET}" ]; then
            echo "ERROR: JWT_SECRET secret is missing."
            exit 1
          fi

          if [ -z "${JWT_REFRESH_SECRET}" ]; then
            echo "ERROR: JWT_REFRESH_SECRET secret is missing."
            exit 1
          fi

          if [ -z "${SESSION_SECRET}" ]; then
            echo "ERROR: SESSION_SECRET secret is missing."
            exit 1
          fi


          # ------------------------------------------------------
          # Application configuration
          # ------------------------------------------------------

          NODE_ENV="${{ vars.NODE_ENV }}"
          APP_NAME="${{ vars.APP_NAME }}"
          APP_VERSION="${{ vars.APP_VERSION }}"
          APP_PORT="${{ vars.APP_PORT }}"

          APP_URL="${{ vars.APP_URL }}"
          FRONTEND_URL="${{ vars.FRONTEND_URL }}"
          CORS_ORIGIN="${{ vars.CORS_ORIGIN }}"

          # Safe HTTP defaults for initial deployment.
          # Change these GitHub Variables when HTTPS is configured.

          if [ -z "${APP_URL}" ]; then
            APP_URL="http://localhost:8080"
          fi

          if [ -z "${FRONTEND_URL}" ]; then
            FRONTEND_URL="http://localhost:8080"
          fi

          if [ -z "${CORS_ORIGIN}" ]; then
            CORS_ORIGIN="${FRONTEND_URL}"
          fi


          # ------------------------------------------------------
          # Database configuration
          # ------------------------------------------------------

          DATABASE_NAME="${{ vars.DATABASE_NAME }}"
          DATABASE_USER="${{ vars.DATABASE_USER }}"
          DATABASE_SSL="${{ vars.DATABASE_SSL }}"

          DATABASE_POOL_MIN="${{ vars.DATABASE_POOL_MIN }}"
          DATABASE_POOL_MAX="${{ vars.DATABASE_POOL_MAX }}"

          DATABASE_IDLE_TIMEOUT_MS="${{ vars.DATABASE_IDLE_TIMEOUT_MS }}"
          DATABASE_CONNECTION_TIMEOUT_MS="${{ vars.DATABASE_CONNECTION_TIMEOUT_MS }}"

          if [ -z "${DATABASE_NAME}" ]; then
            DATABASE_NAME="inventory_management"
          fi

          if [ -z "${DATABASE_USER}" ]; then
            DATABASE_USER="inventory_app"
          fi

          if [ -z "${DATABASE_SSL}" ]; then
            DATABASE_SSL="false"
          fi

          if [ -z "${DATABASE_POOL_MIN}" ]; then
            DATABASE_POOL_MIN="2"
          fi

          if [ -z "${DATABASE_POOL_MAX}" ]; then
            DATABASE_POOL_MAX="20"
          fi

          if [ -z "${DATABASE_IDLE_TIMEOUT_MS}" ]; then
            DATABASE_IDLE_TIMEOUT_MS="30000"
          fi

          if [ -z "${DATABASE_CONNECTION_TIMEOUT_MS}" ]; then
            DATABASE_CONNECTION_TIMEOUT_MS="10000"
          fi


          # ------------------------------------------------------
          # JWT configuration
          # ------------------------------------------------------

          JWT_EXPIRES_IN="${{ vars.JWT_EXPIRES_IN }}"
          JWT_REFRESH_EXPIRES_IN="${{ vars.JWT_REFRESH_EXPIRES_IN }}"

          if [ -z "${JWT_EXPIRES_IN}" ]; then
            JWT_EXPIRES_IN="15m"
          fi

          if [ -z "${JWT_REFRESH_EXPIRES_IN}" ]; then
            JWT_REFRESH_EXPIRES_IN="7d"
          fi


          # ------------------------------------------------------
          # Cookie configuration
          # ------------------------------------------------------

          COOKIE_SECURE="${{ vars.COOKIE_SECURE }}"
          COOKIE_HTTP_ONLY="${{ vars.COOKIE_HTTP_ONLY }}"
          COOKIE_SAME_SITE="${{ vars.COOKIE_SAME_SITE }}"

          # Current deployment is HTTP on port 8080.
          # Secure cookies require HTTPS.

          if [ -z "${COOKIE_SECURE}" ]; then
            COOKIE_SECURE="false"
          fi

          if [ -z "${COOKIE_HTTP_ONLY}" ]; then
            COOKIE_HTTP_ONLY="true"
          fi

          if [ -z "${COOKIE_SAME_SITE}" ]; then
            COOKIE_SAME_SITE="lax"
          fi


          # ------------------------------------------------------
          # Logging
          # ------------------------------------------------------

          LOG_LEVEL="${{ vars.LOG_LEVEL }}"
          LOG_FORMAT="${{ vars.LOG_FORMAT }}"

          if [ -z "${LOG_LEVEL}" ]; then
            LOG_LEVEL="info"
          fi

          if [ -z "${LOG_FORMAT}" ]; then
            LOG_FORMAT="json"
          fi


          # ------------------------------------------------------
          # Upload configuration
          # ------------------------------------------------------

          MAX_UPLOAD_SIZE_MB="${{ vars.MAX_UPLOAD_SIZE_MB }}"
          ALLOWED_UPLOAD_EXTENSIONS="${{ vars.ALLOWED_UPLOAD_EXTENSIONS }}"

          if [ -z "${MAX_UPLOAD_SIZE_MB}" ]; then
            MAX_UPLOAD_SIZE_MB="20"
          fi

          if [ -z "${ALLOWED_UPLOAD_EXTENSIONS}" ]; then
            ALLOWED_UPLOAD_EXTENSIONS=".xlsx,.xls,.csv"
          fi


          # ------------------------------------------------------
          # Pagination
          # ------------------------------------------------------

          DEFAULT_PAGE_SIZE="${{ vars.DEFAULT_PAGE_SIZE }}"
          MAX_PAGE_SIZE="${{ vars.MAX_PAGE_SIZE }}"

          if [ -z "${DEFAULT_PAGE_SIZE}" ]; then
            DEFAULT_PAGE_SIZE="25"
          fi

          if [ -z "${MAX_PAGE_SIZE}" ]; then
            MAX_PAGE_SIZE="100"
          fi


          # ------------------------------------------------------
          # Expiry / audit configuration
          # ------------------------------------------------------

          AUDIT_LOG_RETENTION_DAYS="${{ vars.AUDIT_LOG_RETENTION_DAYS }}"
          WARRANTY_EXPIRY_WARNING_DAYS="${{ vars.WARRANTY_EXPIRY_WARNING_DAYS }}"
          LICENSE_EXPIRY_WARNING_DAYS="${{ vars.LICENSE_EXPIRY_WARNING_DAYS }}"

          if [ -z "${AUDIT_LOG_RETENTION_DAYS}" ]; then
            AUDIT_LOG_RETENTION_DAYS="365"
          fi

          if [ -z "${WARRANTY_EXPIRY_WARNING_DAYS}" ]; then
            WARRANTY_EXPIRY_WARNING_DAYS="30"
          fi

          if [ -z "${LICENSE_EXPIRY_WARNING_DAYS}" ]; then
            LICENSE_EXPIRY_WARNING_DAYS="30"
          fi


          # ------------------------------------------------------
          # SMTP configuration
          # ------------------------------------------------------

          SMTP_HOST="${{ vars.SMTP_HOST }}"
          SMTP_PORT="${{ vars.SMTP_PORT }}"
          SMTP_SECURE="${{ vars.SMTP_SECURE }}"
          SMTP_USER="${{ vars.SMTP_USER }}"
          SMTP_PASSWORD="${{ vars.SMTP_PASSWORD }}"
          SMTP_FROM_NAME="${{ vars.SMTP_FROM_NAME }}"
          SMTP_FROM_EMAIL="${{ vars.SMTP_FROM_EMAIL }}"

          if [ -z "${SMTP_PORT}" ]; then
            SMTP_PORT="587"
          fi

          if [ -z "${SMTP_SECURE}" ]; then
            SMTP_SECURE="false"
          fi

          if [ -z "${SMTP_FROM_NAME}" ]; then
            SMTP_FROM_NAME="Inventory Management"
          fi


          # ------------------------------------------------------
          # PostgreSQL container configuration
          # ------------------------------------------------------

          POSTGRES_DB="${{ vars.POSTGRES_DB }}"
          POSTGRES_USER="${{ vars.POSTGRES_USER }}"
          POSTGRES_PORT="${{ vars.POSTGRES_PORT }}"

          if [ -z "${POSTGRES_DB}" ]; then
            POSTGRES_DB="inventory_management"
          fi

          if [ -z "${POSTGRES_USER}" ]; then
            POSTGRES_USER="inventory_app"
          fi

          if [ -z "${POSTGRES_PORT}" ]; then
            POSTGRES_PORT="5432"
          fi


          # ------------------------------------------------------
          # Write production .env
          # ------------------------------------------------------

          umask 077

          cat > .env <<EOF
          NODE_ENV=${NODE_ENV}

          APP_NAME=${APP_NAME}
          APP_VERSION=${APP_VERSION}
          APP_HOST=0.0.0.0
          APP_PORT=${APP_PORT}

          APP_URL=${APP_URL}
          FRONTEND_URL=${FRONTEND_URL}

          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_NAME=${DATABASE_NAME}
          DATABASE_USER=${DATABASE_USER}
          DATABASE_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_SSL=${DATABASE_SSL}

          DATABASE_POOL_MIN=${DATABASE_POOL_MIN}
          DATABASE_POOL_MAX=${DATABASE_POOL_MAX}
          DATABASE_IDLE_TIMEOUT_MS=${DATABASE_IDLE_TIMEOUT_MS}
          DATABASE_CONNECTION_TIMEOUT_MS=${DATABASE_CONNECTION_TIMEOUT_MS}

          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=${JWT_EXPIRES_IN}

          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}

          SESSION_SECRET=${SESSION_SECRET}

          COOKIE_SECURE=${COOKIE_SECURE}
          COOKIE_HTTP_ONLY=${COOKIE_HTTP_ONLY}
          COOKIE_SAME_SITE=${COOKIE_SAME_SITE}

          CORS_ORIGIN=${CORS_ORIGIN}

          LOG_LEVEL=${LOG_LEVEL}
          LOG_FORMAT=${LOG_FORMAT}

          MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB}
          ALLOWED_UPLOAD_EXTENSIONS=${ALLOWED_UPLOAD_EXTENSIONS}

          DEFAULT_PAGE_SIZE=${DEFAULT_PAGE_SIZE}
          MAX_PAGE_SIZE=${MAX_PAGE_SIZE}

          AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS}
          WARRANTY_EXPIRY_WARNING_DAYS=${WARRANTY_EXPIRY_WARNING_DAYS}
          LICENSE_EXPIRY_WARNING_DAYS=${LICENSE_EXPIRY_WARNING_DAYS}

          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_SECURE=${SMTP_SECURE}
          SMTP_USER=${SMTP_USER}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SMTP_FROM_NAME=${SMTP_FROM_NAME}
          SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}

          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_PORT=${POSTGRES_PORT}
          EOF

          chmod 600 .env

          echo "Production environment created successfully."


      # ==========================================================
      # 5. Validate Compose
      # ==========================================================

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          docker compose config > /tmp/inventory-compose-config.yml

          echo "Docker Compose configuration is valid."


      # ==========================================================
      # 6. Build Docker images
      # ==========================================================

      - name: Build Docker images
        shell: bash
        run: |
          set -euo pipefail

          docker compose build --pull

          echo "Docker images built successfully."


      # ==========================================================
      # 7. Start PostgreSQL
      # ==========================================================

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          docker compose up -d postgres

          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do

            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' \
              inventory-postgres 2>/dev/null || true)

            echo "PostgreSQL health: ${STATUS}"

            if [ "${STATUS}" = "healthy" ]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi

            sleep 5

          done

          echo "ERROR: PostgreSQL did not become healthy."

          docker compose logs postgres --tail=100

          exit 1


      # ==========================================================
      # 8. Run database migrations
      # ==========================================================

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail

          docker compose run --rm backend npm run db:migrate

          echo "Database migrations completed successfully."


      # ==========================================================
      # 9. Seed database
      # ==========================================================

      - name: Seed database
        shell: bash
        run: |
          set -euo pipefail

          docker compose run --rm backend npm run db:seed

          echo "Database seed completed successfully."


      # ==========================================================
      # 10. Start application
      # ==========================================================

      - name: Start application
        shell: bash
        run: |
          set -euo pipefail

          docker compose up -d

          echo "Application containers started."


      # ==========================================================
      # 11. Wait for backend health
      # ==========================================================

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for backend..."

          for i in {1..30}; do

            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' \
              inventory-backend 2>/dev/null || true)

            echo "Backend health: ${STATUS}"

            if [ "${STATUS}" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi

            sleep 5

          done

          echo "ERROR: Backend did not become healthy."

          docker compose logs backend --tail=150

          exit 1


      # ==========================================================
      # 12. Deployment status
      # ==========================================================

      - name: Deployment status
        shell: bash
        run: |
          set -euo pipefail

          docker compose ps

          echo ""
          echo "Deployment completed successfully."


      # ==========================================================
      # 13. Cleanup
      # ==========================================================

      - name: Cleanup unused Docker resources
        if: always()
        shell: bash
        run: |
          docker image prune -f || true