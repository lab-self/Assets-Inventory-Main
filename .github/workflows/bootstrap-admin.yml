name: Bootstrap Inventory Administrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-admin:
    name: Create Initial Administrator
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify backend container
        shell: bash
        run: |
          set -euo pipefail

          if ! docker ps --format '{{.Names}}' | grep -qx 'inventory-backend'; then
            echo "ERROR: inventory-backend container is not running."
            docker ps -a
            exit 1
          fi

          echo "inventory-backend container is running."

      - name: Bootstrap administrator
        shell: bash
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_EMAIL}" ]; then
            echo "ERROR: ADMIN_EMAIL GitHub secret is missing."
            exit 1
          fi

          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "ERROR: ADMIN_PASSWORD GitHub secret is missing."
            exit 1
          fi

          docker exec \
            -e ADMIN_EMAIL="${ADMIN_EMAIL}" \
            -e ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            inventory-backend \
            node dist/database/seed.js

          echo "Administrator bootstrap completed."

      - name: Verify application containers
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps || true
          echo "Administrator bootstrap workflow completed successfully."
